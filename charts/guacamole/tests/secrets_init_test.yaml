suite: secrets init job
templates:
  - secrets/job.yaml
  - secrets/rbac.yaml
values:
  - values-external-pg.yaml
release:
  name: test
  namespace: guac
tests:
  - it: runs as pre-install/pre-upgrade hook and Argo CD PreSync hook
    template: secrets/job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
  - it: creates the RBAC before the job
    template: secrets/rbac.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-15"
        documentIndex: 2
  - it: checks the database secret and generates the admin secret by default
    template: secrets/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXISTING_SECRETS
            value: db-secret:password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_SECRETS
            value: test-guacamole-admin:password
  - it: checks a user-provided admin secret instead of generating one
    template: secrets/job.yaml
    set:
      auth.admin.existingSecret: my-admin
      auth.admin.secretKey: pw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXISTING_SECRETS
            value: db-secret:password my-admin:pw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_SECRETS
            value: ""
  - it: restricts "get" to the referenced secrets
    template: secrets/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: rules[1].resourceNames
          value: [db-secret, test-guacamole-admin]
      - equal:
          path: rules[0].verbs
          value: [create]
  - it: mounts the ServiceAccount token only in this job
    template: secrets/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-guacamole-secrets-init
  - it: runs restricted with the guacamole image
    template: secrets/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/guacamole/guacamole:1.6.0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
  - it: applies backoffLimit and activeDeadlineSeconds
    template: secrets/job.yaml
    set:
      initJobs.backoffLimit: 5
      initJobs.activeDeadlineSeconds: 120
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 5
      - equal:
          path: spec.activeDeadlineSeconds
          value: 120
  - it: generates the embedded database secret with both keys
    template: secrets/job.yaml
    values: []
    set:
      database.mode: embedded
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_SECRETS
            value: test-guacamole-database:password,superuser-password test-guacamole-admin:password
  - it: checks an existing embedded database secret
    template: secrets/job.yaml
    set:
      database.mode: embedded
      database.embedded.existingSecret: my-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXISTING_SECRETS
            value: my-db:password,superuser-password
