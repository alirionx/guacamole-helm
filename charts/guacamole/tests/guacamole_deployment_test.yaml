suite: guacamole deployment
templates:
  - guacamole/deployment.yaml
  - guacamole/configmap.yaml
values:
  - values-external-pg.yaml
release:
  name: test
  namespace: guac
tests:
  - it: uses the appVersion as default image tag
    template: guacamole/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/guacamole/guacamole:1.6.0
  - it: prefers the digest over the tag
    template: guacamole/deployment.yaml
    set:
      guacamole.image.tag: "9.9.9"
      guacamole.image.digest: sha256:abc
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/guacamole/guacamole@sha256:abc
  - it: passes the database password via secretKeyRef
    template: guacamole/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
  - it: passes the MySQL password via secretKeyRef
    template: guacamole/deployment.yaml
    set:
      database.type: mysql
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
  - it: honours a custom secret key
    template: guacamole/deployment.yaml
    set:
      database.external.secretKey: pw
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: pw
  - it: disables service links and token automount
    template: guacamole/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: runs restricted (non-root, read-only root fs, no capabilities)
    template: guacamole/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
  - it: sets a config checksum annotation
    template: guacamole/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
  - it: probes the root context by default
    template: guacamole/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
  - it: probes a custom context path
    template: guacamole/deployment.yaml
    set:
      guacamole.contextPath: /guacamole
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /guacamole/
  - it: appends extraEnv
    template: guacamole/deployment.yaml
    set:
      guacamole.extraEnv:
        - name: FOO
          value: bar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: bar
  - it: sets the component label
    template: guacamole/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: guacamole
      - equal:
          path: metadata.name
          value: test-guacamole
