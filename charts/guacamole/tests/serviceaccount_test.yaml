suite: serviceaccount
templates:
  - serviceaccount.yaml
  - guacamole/deployment.yaml
  - guacamole/configmap.yaml
values:
  - values-external-pg.yaml
release:
  name: test
tests:
  - it: creates a ServiceAccount without token automount
    template: serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.name
          value: test-guacamole
  - it: uses an existing ServiceAccount
    set:
      serviceAccount.create: false
      serviceAccount.name: my-sa
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa
        template: guacamole/deployment.yaml
  - it: requires a name for an existing ServiceAccount
    template: guacamole/deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorPattern: serviceAccount.name is required
