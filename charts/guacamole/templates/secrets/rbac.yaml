{{- $name := include "guacamole.componentName" (dict "context" . "component" "secrets-init") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "secrets-init") | nindent 4 }}
  annotations:
    {{- include "guacamole.init.secretsHook" (dict "weight" -20 "deletePolicy" "before-hook-creation,hook-succeeded") | nindent 4 }}
    {{- with .Values.initJobs.secrets.serviceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "secrets-init") | nindent 4 }}
  annotations:
    {{- include "guacamole.init.secretsHook" (dict "weight" -20 "deletePolicy" "before-hook-creation,hook-succeeded") | nindent 4 }}
rules:
  # "create" cannot be restricted to resource names by Kubernetes RBAC.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ include "guacamole.init.secretNames" . }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "secrets-init") | nindent 4 }}
  annotations:
    {{- include "guacamole.init.secretsHook" (dict "weight" -15 "deletePolicy" "before-hook-creation,hook-succeeded") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
