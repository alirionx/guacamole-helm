{{- include "guacamole.database.validate" . }}
{{- $name := include "guacamole.componentName" (dict "context" . "component" "secrets-init") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "secrets-init") | nindent 4 }}
  annotations:
    {{- include "guacamole.init.secretsHook" (dict "weight" -10 "deletePolicy" "before-hook-creation,hook-succeeded" "argoDeletePolicy" "BeforeHookCreation,HookSucceeded") | nindent 4 }}
spec:
  backoffLimit: {{ .Values.initJobs.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.initJobs.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "guacamole.componentLabels" (dict "context" . "component" "secrets-init") | nindent 8 }}
        {{- with .Values.initJobs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.initJobs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      # The only pod of this chart that talks to the Kubernetes API.
      automountServiceAccountToken: true
      {{- include "guacamole.init.podCommon" . | nindent 6 }}
      containers:
        - name: secrets-init
          image: {{ include "guacamole.image" (dict "image" .Values.guacamole.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.guacamole.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - {{ .Files.Get "files/secrets-init.sh" | quote }}
          env:
            - name: EXISTING_SECRETS
              value: {{ include "guacamole.init.existingSecrets" . | quote }}
            - name: MANAGED_SECRETS
              value: {{ include "guacamole.init.managedSecrets" . | quote }}
            - name: SECRET_LABELS
              value: {{ include "guacamole.componentSelectorLabels" (dict "context" . "component" "secrets-init") | fromYaml | toJson | quote }}
          securityContext:
            {{- toYaml .Values.initJobs.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initJobs.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
