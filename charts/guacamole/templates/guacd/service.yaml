apiVersion: v1
kind: Service
metadata:
  name: {{ include "guacamole.componentName" (dict "context" . "component" "guacd") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "guacd") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: guacd
      port: {{ .Values.guacd.service.port }}
      targetPort: guacd
      protocol: TCP
  selector:
    {{- include "guacamole.componentSelectorLabels" (dict "context" . "component" "guacd") | nindent 4 }}
