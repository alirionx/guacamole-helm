{{- if include "guacamole.database.embedded" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guacamole.database.embeddedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: database
      port: {{ include "guacamole.database.defaultPort" . }}
      targetPort: database
      protocol: TCP
  selector:
    {{- include "guacamole.componentSelectorLabels" (dict "context" . "component" "database") | nindent 4 }}
{{- end }}
