{{- include "guacamole.database.validate" . }}
{{- include "guacamole.extensions.validate" . }}
{{- $component := "guacamole" }}
{{- $values := .Values.guacamole }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guacamole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  {{- if not $values.autoscaling.enabled }}
  replicas: {{ $values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "guacamole.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/guacamole/configmap.yaml") . | sha256sum }}
        {{- if $values.extraProperties }}
        checksum/properties: {{ include (print $.Template.BasePath "/guacamole/properties.yaml") . | sha256sum }}
        {{- end }}
        {{- with $values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "guacamole.componentLabels" (dict "context" . "component" $component) | nindent 8 }}
        {{- with $values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "guacamole.serviceAccountName" . }}
      automountServiceAccountToken: false
      # The entrypoint of the official image enables extensions based on environment variable
      # prefixes (e.g. MYSQL_*). Kubernetes service links would inject such variables.
      enableServiceLinks: false
      {{- with include "guacamole.extensions.pullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $values.podSecurityContext | nindent 8 }}
      {{- with include "guacamole.extensions.initContainers" . }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: guacamole
          image: {{ include "guacamole.image" (dict "image" $values.image "context" .) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "guacamole.fullname" . }}
          env:
            - name: {{ include "guacamole.database.envPrefix" . }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "guacamole.database.secretName" . }}
                  key: {{ include "guacamole.database.secretKey" . }}
            {{- if .Values.auth.duo.enabled }}
            - name: DUO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.duo.existingSecret }}
                  key: {{ .Values.auth.duo.secretKey }}
            {{- end }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ include "guacamole.contextPathSlash" . }}
              port: http
            {{- toYaml $values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ include "guacamole.contextPathSlash" . }}
              port: http
            {{- toYaml $values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            # The entrypoint generates GUACAMOLE_HOME and CATALINA_BASE below /tmp. /etc/guacamole is
            # only used as template: its extensions and guacamole.properties are added to the generated
            # home, next to the official extensions enabled via environment variables.
            - name: tmp
              mountPath: /tmp
            {{- if $values.extraExtensions }}
            {{- $first := first $values.extraExtensions }}
            {{- if $first.imageVolume }}
            # Image volume: the directory with the JARs is mounted directly, no init container
            # (container runtimes only support directories as image volume subPath).
            - name: extensions
              mountPath: /etc/guacamole/extensions
              subPath: {{ $first.imageVolume.path | default "extensions" }}
              readOnly: true
            {{- else }}
            - name: extensions
              mountPath: /etc/guacamole/extensions
            {{- end }}
            {{- end }}
            {{- if $values.extraProperties }}
            - name: properties
              mountPath: /etc/guacamole/guacamole.properties
              subPath: guacamole.properties
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $values.extraExtensions }}
        {{- with (first $values.extraExtensions).imageVolume }}
        - name: extensions
          image:
            reference: {{ .reference | quote }}
            pullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
        {{- else }}
        - name: extensions
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if $values.extraProperties }}
        - name: properties
          configMap:
            name: {{ include "guacamole.fullname" . }}-properties
        {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
