apiVersion: v1
kind: Pod
metadata:
  name: {{ include "guacamole.componentName" (dict "context" . "component" "test") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guacamole.componentLabels" (dict "context" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "guacamole.serviceAccountName" . }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.guacamole.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: {{ include "guacamole.image" (dict "image" .Values.guacamole.image "context" .) | quote }}
      imagePullPolicy: {{ .Values.guacamole.image.pullPolicy }}
      command: ["/bin/sh", "-c"]
      args:
        - {{ .Files.Get "files/test-login.sh" | quote }}
      env:
        - name: URL
          value: {{ printf "http://%s:%v%s" (include "guacamole.fullname" .) .Values.guacamole.service.port (include "guacamole.contextPathSlash" .) | quote }}
      securityContext:
        {{- toYaml .Values.guacamole.securityContext | nindent 8 }}
      resources:
        {{- toYaml .Values.initJobs.resources | nindent 8 }}
