# Argo CD: one Guacamole instance from the OCI chart on ghcr.io.
# The init jobs run as Argo CD sync hooks (secret init: PreSync, schema init: PostSync); a failing
# hook fails the sync. The Helm test pod is not used by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guacamole
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/alirionx/charts
    chart: guacamole
    targetRevision: 0.1.0
    helm:
      valuesObject:
        ingress:
          enabled: true
          className: traefik
          hosts: [guacamole.example.com]
          tls:
            enabled: true
        networkPolicy:
          enabled: true
          guacamole:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: guacamole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
---
# Helm charts in OCI registries need a repository declaration with enableOCI (no credentials for a
# public package).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-alirionx-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: ghcr-alirionx-charts
  type: helm
  url: ghcr.io/alirionx/charts
  enableOCI: "true"
