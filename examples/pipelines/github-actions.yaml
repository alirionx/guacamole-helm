# GitHub Actions: lint and diff on pull requests, deploy on main. Store the kubeconfig of the
# target cluster in the secret KUBECONFIG and the values in deploy/guacamole/values.yaml.
# Copy to .github/workflows/guacamole.yaml in your configuration repository.
name: guacamole

on:
  pull_request:
    paths: [deploy/guacamole/**]
  push:
    branches: [main]
    paths: [deploy/guacamole/**]

env:
  CHART: oci://ghcr.io/alirionx/charts/guacamole
  CHART_VERSION: 0.1.2
  RELEASE: guacamole
  NAMESPACE: guacamole
  VALUES: deploy/guacamole/values.yaml

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Lint (render with the values)
        run: helm template "$RELEASE" "$CHART" --version "$CHART_VERSION" -f "$VALUES" > /dev/null
      - name: Diff against the cluster
        run: |
          helm plugin install https://github.com/databus23/helm-diff
          helm diff upgrade "$RELEASE" "$CHART" --version "$CHART_VERSION" -n "$NAMESPACE" \
            -f "$VALUES" --allow-unreleased

  deploy:
    if: github.event_name == 'push'
    needs: diff
    runs-on: ubuntu-latest
    environment: production
    concurrency: guacamole-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      # --wait fails if an init job (secret or schema init) fails; --atomic rolls back.
      - name: Deploy
        run: |
          helm upgrade --install "$RELEASE" "$CHART" --version "$CHART_VERSION" \
            -n "$NAMESPACE" --create-namespace -f "$VALUES" --wait --atomic --timeout 10m
          helm test "$RELEASE" -n "$NAMESPACE" --logs
