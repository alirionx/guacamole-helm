# Lint, unit tests and manifest validation; installation tests in kind (chart-testing, OIDC
# against Dex, upgrade from the latest release).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CHART: charts/guacamole
  KUBECONFORM_VERSION: v0.8.0
  HELM_DOCS_VERSION: 1.14.2
  HELM_UNITTEST_VERSION: v1.2.1

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The chart supports Helm 3 and Helm 4.
        helm: [v3.22.1, v4.3.1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}
      - name: Install tools
        run: |
          # Helm 4 verifies plugin signatures; helm-unittest is installed from source.
          args=(); if helm version --short | grep -q '^v4'; then args+=(--verify=false); fi
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" "${args[@]}"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" |
            sudo tar xz -C /usr/local/bin kubeconform
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" |
            sudo tar xz -C /usr/local/bin helm-docs
      - name: helm lint
        run: helm lint "$CHART" --strict
      - name: Unit tests
        run: helm unittest "$CHART"
      - name: Render and validate all examples
        run: |
          for f in examples/*.yaml; do
            echo "::group::$f"
            helm template test "$CHART" -f "$f" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          # Argo CD and Flux examples (CRD schemas from the catalog)
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            examples/gitops/*.yaml
      - name: README is up to date (helm-docs)
        run: |
          helm-docs --chart-search-root charts
          git diff --exit-code -- "$CHART/README.md" ||
            { echo "::error::README.md is outdated, run helm-docs"; exit 1; }
      - name: shellcheck
        run: shellcheck -x "$CHART"/files/*.sh ci/*.sh examples/cli/*.sh
      - uses: helm/chart-testing-action@v2.9.0
      - name: ct lint
        run: |
          # The version increment is only checked for pull requests.
          ct lint --config ct.yaml --all \
            --check-version-increment="${{ github.event_name == 'pull_request' }}"

  install:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Kubernetes version and the default of kind.
        node: [kindest/node:v1.29.8, default]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: helm/chart-testing-action@v2.9.0
      - uses: helm/kind-action@v1.15.1
        with:
          node_image: ${{ matrix.node != 'default' && matrix.node || '' }}
      - name: ct install (all ci/*-values.yaml, including helm test)
        run: ct install --config ct.yaml --all

  integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1.15.1
      - name: OIDC single sign-on against Dex
        run: ci/oidc-dex.sh
      - name: Upgrade from the latest release (PostgreSQL)
        run: ci/upgrade-test.sh
      - name: Upgrade from the latest release (MariaDB)
        run: NS=guacamole-upgrade-mariadb TYPE=mysql ci/upgrade-test.sh
      - name: Show pods on failure
        if: failure()
        run: |
          kubectl get pods -A
          for ns in guacamole-oidc guacamole-upgrade guacamole-upgrade-mariadb; do
            kubectl -n "$ns" describe pods || true
            kubectl -n "$ns" logs deploy/guacamole --tail=100 || true
          done
